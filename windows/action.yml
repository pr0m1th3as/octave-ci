name: 'Install Octave for package CI (Windows)'
description: 'Install GNU Octave for Windows, without its bundled packages'
author: 'Andreas Bertsatos'

inputs:
  version:
    description: 'Octave version; needs a matching release of this repository'
    required: false
    default: '11.3.0'

outputs:
  octave:
    description: 'Path to octave-launch.exe'
    value: ${{ steps.extract.outputs.octave }}

runs:
  using: 'composite'
  steps:
    - name: Fetch the checksum
      id: sum
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BASE: https://github.com/pr0m1th3as/octave-ci/releases/download
      run: |
        set -euo pipefail
        dir="$(cygpath -u "$RUNNER_TEMP")/octave-ci"
        name="octave-$VERSION-w64.7z"
        mkdir -p "$dir"
        # A certificate check the revocation server cannot answer is let
        # through, and any failure is retried, not only a timeout
        curl -fsSL --retry 3 --retry-all-errors --ssl-revoke-best-effort \
          -o "$dir/$name.sha256" "$BASE/octave-$VERSION/$name.sha256"
        echo "hash=$(cut -d ' ' -f 1 "$dir/$name.sha256")" >> "$GITHUB_OUTPUT"

    - name: Restore the archive from the cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/octave-ci/octave-${{ inputs.version }}-w64.7z
        key: octave-ci-${{ inputs.version }}-w64-${{ steps.sum.outputs.hash }}

    - name: Download and verify the archive
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BASE: https://github.com/pr0m1th3as/octave-ci/releases/download
      run: |
        set -euo pipefail
        dir="$(cygpath -u "$RUNNER_TEMP")/octave-ci"
        name="octave-$VERSION-w64.7z"
        if [ ! -f "$dir/$name" ]; then
          curl -fsSL --retry 3 --retry-all-errors --ssl-revoke-best-effort \
            -o "$dir/$name" "$BASE/octave-$VERSION/$name"
        fi
        (cd "$dir" && sha256sum -c "$name.sha256")

    - name: Save the archive to the cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/octave-ci/octave-${{ inputs.version }}-w64.7z
        key: octave-ci-${{ inputs.version }}-w64-${{ steps.sum.outputs.hash }}

    - name: Extract Octave without the bundled packages
      id: extract
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        dir="$(cygpath -u "$RUNNER_TEMP")/octave-ci"
        archive="$(cygpath -w "$dir/octave-$VERSION-w64.7z")"
        r="octave-$VERSION-w64"
        # Leave out the bundled packages and their list, and the folders that
        # package tests never use: documentation, CMake modules, Qt, LLVM and
        # wxWidgets headers, and the MSYS Python and terminfo.
        skip=(
          "-x!$r/mingw64/share/octave/packages"
          "-x!$r/mingw64/lib/octave/packages"
          "-xr!octave_packages"
          "-x!$r/mingw64/share/cmake-*"
          "-x!$r/mingw64/share/doc"
          "-x!$r/mingw64/share/man"
          "-x!$r/mingw64/share/info"
          "-x!$r/mingw64/qt6/include"
          "-x!$r/mingw64/include/llvm"
          "-x!$r/mingw64/include/wx-*"
          "-x!$r/usr/lib/python3*"
          "-x!$r/usr/lib/terminfo"
          "-x!$r/usr/share/terminfo"
          "-x!$r/usr/share/man"
          "-x!$r/usr/share/info"
        )
        rm -rf /c/octave-ci
        7z x -y -o'C:\octave-ci' "$archive" "${skip[@]}" > /dev/null
        root="/c/octave-ci/$r"
        cygpath -w "$root" >> "$GITHUB_PATH"
        launch="$(cygpath -w "$root/octave-launch.exe")"
        echo "octave=$launch" >> "$GITHUB_OUTPUT"

    - name: Check that no package is installed
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CHECK: >-
          printf ('Octave %s\n', version ());
          if (! isempty (pkg ('list')))
          error ('octave-ci: bundled packages are still installed.');
          endif
      run: |
        set -euo pipefail
        "/c/octave-ci/octave-$VERSION-w64/octave-launch.exe" --no-gui --norc \
          --silent --no-history --eval "$CHECK"
