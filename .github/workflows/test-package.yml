name: Package test workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ciprobe:
    uses: ./.github/workflows/package-test.yml
    with:
      path: tests/ciprobe
      windows-versions: '["11.1.0", "11.3.0"]'
      warning-flags: '-O2 -Wall -Wextra'

  # The warning fixture: its oct-file warns on purpose, so a green run means
  # the flags reached the compiler, the warning was captured and the exclude
  # filtered it.  All three platforms, because that is the only way to know
  # the chain holds on each of them; one test job is enough beside it.
  ciwarn:
    uses: ./.github/workflows/package-test.yml
    with:
      path: tests/ciwarn
      linux-versions: '["11.3.0"]'
      windows-versions: '[]'
      macos: false
      warning-flags: '-O2 -Wall -Wextra'
      warning-platforms: '["linux", "windows", "macos"]'
      warning-exclude: '__ciwarn__\.cc:'

  # A green warnings job proves nothing on its own: had the flags never
  # reached the compiler there would be no warning, nothing to exclude and
  # the job would pass having checked nothing.  So assert that each
  # platform's build log really holds the warning the fixture plants.
  ciwarn-planted:
    name: Warning reached the log
    needs: ciwarn
    runs-on: ubuntu-latest
    steps:
      - name: Download the build logs
        uses: actions/download-artifact@v7
        with:
          pattern: build-log-warnings-ciwarn-*
          path: build-logs

      - name: Check every platform warned
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for platform in linux windows macos; do
            log="build-logs/build-log-warnings-ciwarn-$platform/build.log"
            if [ ! -f "$log" ]; then
              echo "::error::no build log for $platform"
              missing=1
              continue
            fi
            if tr -d '\r' < "$log" \
               | grep -qE '__ciwarn__\.cc:.*warning:.*unused variable'; then
              echo "$platform: the planted warning reached the log"
            else
              echo "::error::$platform built without the planted warning, so"\
                   "the flags did not reach the compiler"
              missing=1
            fi
          done
          exit "$missing"
