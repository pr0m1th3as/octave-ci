name: Package tests

on:
  workflow_call:
    inputs:
      path:
        description: 'Folder holding the package DESCRIPTION'
        type: string
        default: '.'
      linux-versions:
        description: 'JSON list of Octave container versions'
        type: string
        default: '["11.1.0", "11.3.0"]'
      windows-versions:
        description: 'JSON list of them; empty or [] skips Windows'
        type: string
        default: '["11.1.0", "11.3.0"]'
      macos:
        description: 'Test on macOS with Homebrew Octave'
        type: boolean
        default: true
      dependencies:
        description: 'Octave Packages to install first, separated by spaces'
        type: string
        default: ''
      warning-flags:
        description: 'Compiler flags for the warnings jobs; empty skips them'
        type: string
        default: ''
      warning-platforms:
        description: 'JSON list of linux, windows, macos to gate on warnings'
        type: string
        default: '["linux"]'
      warning-linux-version:
        description: 'Octave container the Linux warnings job builds under'
        type: string
        default: '11.3.0'
      warning-windows-version:
        description: 'Octave release the Windows warnings job builds under'
        type: string
        default: '11.3.0'
      warning-exclude:
        description: 'Extended regexp of warning lines to ignore'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  linux:
    name: Linux, Octave ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.linux-versions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the package archive
        id: archive
        shell: bash
        env:
          PKG_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          tree=HEAD
          if [ -n "$PKG_PATH" ] && [ "$PKG_PATH" != "." ]; then
            tree="HEAD:${PKG_PATH%/}"
          fi
          git archive --format=tar.gz --prefix=package/ \
            -o package.tar.gz "$tree"
          name="$(tr -d '\r' < "$PKG_PATH/DESCRIPTION" \
                  | sed -n 's/^Name: *//p' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install and test in the Octave container
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          NAME: ${{ steps.archive.outputs.name }}
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          set -euo pipefail
          code=""
          for dep in $DEPENDENCIES; do
            code+="for a = 1:3; try; "
            code+="pkg ('install', '-forge', '-local', '$dep'); break; catch; "
            code+="if (a == 3); error ('$dep could not be installed'); endif; "
            code+="printf ('installing $dep failed, retrying\\n'); "
            code+="pause (20 * a); end_try_catch; endfor; "
          done
          code+="pkg ('install', '-local', '/work/package.tar.gz'); "
          code+="pkg ('load', '$NAME'); pkg ('test', '$NAME');"
          docker run --rm --volume "$PWD:/work" --workdir /work \
            "ghcr.io/gnu-octave/octave:$VERSION" \
            octave-cli --norc --no-history --eval "$code" 2>&1 | tee test.log

      - name: Show the failed tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs
          see='s/^See the file (.*) for additional details\.$/\1/p'
          # No log where the job stopped before the tests ran
          log=""
          if [ -f test.log ]; then
            log="$(tr -d '\r' < test.log | sed -nE "$see" \
                   | tail -1 | sed 's#.*[\\/]##')"
          fi
          for f in "$log" test_suite.log fntests.log; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              cp "$f" test-logs/
              tr -d '\r' < "$f" | awk '
                function flush() {
                  if (bad) {
                    if (!shown) { print "==> " file; shown = 1 }
                    printf "%s", block
                  }
                  block = ""; bad = 0
                }
                /^>>>>> processing / {
                  flush(); file = substr ($0, 18); shown = 0; next
                }
                /^Files with no tests:/ { flush(); exit }
                /^\*\*\*\*\* / { flush(); block = $0 "\n"; next }
                block != "" { block = block $0 "\n"; if (/^!!!!! /) bad = 1 }
                END { flush() }'
              break
            fi
          done
          if [ -f test.log ]; then
            cp test.log test-logs/
          fi

      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-linux-${{ matrix.version }}
          path: test-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check the test results
        shell: bash
        run: |
          set -euo pipefail
          summary="$(tr -d '\r' < test.log | sed -n '/^Summary:$/,$p')"
          count () {
            printf '%s\n' "$summary" | sed -nE "s/^  $1 +([0-9]+)\$/\1/p"
          }
          pass="$(count PASS)"
          fail="$(count FAIL)"
          regr="$(count REGRESSION)"
          if [ -z "$pass" ] || [ "$pass" -eq 0 ]; then
            echo "::error::no test passed"
            exit 1
          fi
          if [ "${fail:-1}" -ne 0 ] || [ "${regr:-0}" -ne 0 ]; then
            echo "::error::${fail:-unknown} failed, ${regr:-0} regressions"
            exit 1
          fi
          echo "$pass tests passed"

  warnings:
    name: Warnings, ${{ matrix.platform }}
    if: inputs.warning-flags != '' && inputs.warning-platforms != '[]'
    runs-on: >-
      ${{ matrix.platform == 'windows' && 'windows-latest'
      || (matrix.platform == 'macos' && 'macos-15' || 'ubuntu-latest') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(inputs.warning-platforms != '[]'
          && inputs.warning-platforms || '[""]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Octave (Windows)
        if: matrix.platform == 'windows'
        uses: pr0m1th3as/octave-ci/windows@v1
        with:
          version: ${{ inputs.warning-windows-version }}

      - name: Install Octave (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          brew install octave

      - name: Build the package archive
        id: archive
        shell: bash
        env:
          PKG_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          tree=HEAD
          if [ -n "$PKG_PATH" ] && [ "$PKG_PATH" != "." ]; then
            tree="HEAD:${PKG_PATH%/}"
          fi
          git archive --format=tar.gz --prefix=package/ \
            -o package.tar.gz "$tree"
          name="$(tr -d '\r' < "$PKG_PATH/DESCRIPTION" \
                  | sed -n 's/^Name: *//p' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Dependencies build under the platform's own flags: only the package
      # under test is gated.  'setenv' reaches 'mkoctfile' because 'make'
      # inherits the interpreter's environment, and the compiler writes its
      # warnings to stderr, which 'pkg install' passes through rather than
      # capturing.
      - name: Build with warnings enabled (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          VERSION: ${{ inputs.warning-linux-version }}
          DEPENDENCIES: ${{ inputs.dependencies }}
          FLAGS: ${{ inputs.warning-flags }}
        run: |
          set -euo pipefail
          code=""
          for dep in $DEPENDENCIES; do
            code+="for a = 1:3; try; "
            code+="pkg ('install', '-forge', '-local', '$dep'); break; catch; "
            code+="if (a == 3); error ('$dep could not be installed'); endif; "
            code+="printf ('installing $dep failed, retrying\\n'); "
            code+="pause (20 * a); end_try_catch; endfor; "
          done
          code+="printf ('%s\\n', '--- package build starts here ---'); "
          code+="setenv ('CFLAGS', '$FLAGS'); "
          code+="setenv ('CXXFLAGS', '$FLAGS'); "
          code+="pkg ('install', '-local', '/work/package.tar.gz');"
          docker run --rm --volume "$PWD:/work" --workdir /work \
            "ghcr.io/gnu-octave/octave:$VERSION" \
            octave-cli --norc --no-history --eval "$code" 2>&1 | tee build.log

      - name: Build with warnings enabled (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
          FLAGS: ${{ inputs.warning-flags }}
        run: |
          set -euo pipefail
          archive="$(cygpath -w "$PWD/package.tar.gz")"
          code=""
          for dep in $DEPENDENCIES; do
            code+="for a = 1:3; try; "
            code+="pkg ('install', '-forge', '-local', '$dep'); break; catch; "
            code+="if (a == 3); error ('$dep could not be installed'); endif; "
            code+="printf ('installing $dep failed, retrying\\n'); "
            code+="pause (20 * a); end_try_catch; endfor; "
          done
          code+="printf ('%s\\n', '--- package build starts here ---'); "
          code+="setenv ('CFLAGS', '$FLAGS'); "
          code+="setenv ('CXXFLAGS', '$FLAGS'); "
          code+="pkg ('install', '-local', '$archive');"
          octave-launch --no-gui --norc --silent --no-history --eval "$code" \
            2>&1 | tee build.log

      - name: Build with warnings enabled (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
          FLAGS: ${{ inputs.warning-flags }}
        run: |
          set -euo pipefail
          code=""
          for dep in $DEPENDENCIES; do
            code+="for a = 1:3; try; "
            code+="pkg ('install', '-forge', '-local', '$dep'); break; catch; "
            code+="if (a == 3); error ('$dep could not be installed'); endif; "
            code+="printf ('installing $dep failed, retrying\\n'); "
            code+="pause (20 * a); end_try_catch; endfor; "
          done
          code+="printf ('%s\\n', '--- package build starts here ---'); "
          code+="setenv ('CFLAGS', '$FLAGS'); "
          code+="setenv ('CXXFLAGS', '$FLAGS'); "
          code+="pkg ('install', '-local', '$PWD/package.tar.gz');"
          octave-cli --norc --no-history --eval "$code" 2>&1 | tee build.log

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-warnings-${{ steps.archive.outputs.name }}-${{ matrix.platform }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Check for compiler warnings
        shell: bash
        env:
          EXCLUDE: ${{ inputs.warning-exclude }}
        run: |
          set -euo pipefail
          # A dependency builds before the marker, under the platform's own
          # flags, and the container's Octave may pass warning options of its
          # own.  Only the package under test is gated, so read past it.
          mark='--- package build starts here ---'
          own="$(tr -d '\r' < build.log | sed -n "/$mark/,\$p")"
          if [ -z "$own" ]; then
            echo "::error::marker not found; the package build did not start"
            exit 1
          fi
          all="$(printf '%s\n' "$own" | grep -E 'warning:' || true)"
          found="$all"
          if [ -n "$EXCLUDE" ]; then
            found="$(printf '%s\n' "$all" | grep -vE "$EXCLUDE" || true)"
            before="$(printf '%s' "$all" | grep -c . || true)"
            after="$(printf '%s' "$found" | grep -c . || true)"
            # An exclude that filters nothing is inert rather than unsafe:
            # a warning it does not match still fails the job below.  It is
            # also the normal state on a platform whose compiler does not
            # raise what the pattern was written for, so say so and carry on.
            if [ "$before" -eq "$after" ]; then
              echo "::warning::warning-exclude matched nothing here: $EXCLUDE"
            else
              echo "excluded $((before - after)) warning(s)"
            fi
          fi
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -ne 0 ]; then
            printf '%s\n' "$found"
            echo "::error::$count compiler warning(s); see the build log"
            exit 1
          fi
          echo "no compiler warnings"

  windows:
    name: Windows, Octave ${{ matrix.version }}
    if: inputs.windows-versions != '' && inputs.windows-versions != '[]'
