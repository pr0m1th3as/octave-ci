          fi
          for f in "$log" test_suite.log fntests.log; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              cp "$f" test-logs/
              tr -d '\r' < "$f" | awk '
                function flush() {
                  if (bad) {
                    if (!shown) { print "==> " file; shown = 1 }
                    printf "%s", block
                  }
                  block = ""; bad = 0
                }
