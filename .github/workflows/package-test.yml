        uses: actions/upload-artifact@v7
        with:
          name: test-logs-macos
          path: test-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check the test results
        shell: bash
        run: |
          set -euo pipefail
          summary="$(tr -d '\r' < test.log | sed -n '/^Summary:$/,$p')"
          count () {
            printf '%s\n' "$summary" | sed -nE "s/^  $1 +([0-9]+)\$/\1/p"
